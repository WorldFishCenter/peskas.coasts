default:
  trips:
    matched: trips-matched
  api:
    trips:
      bucket: peskas-api-dev
      mozambique:
        raw:
          file_prefix: trips-raw
          cloud_path: mozambique/raw
        validated:
          file_prefix: trips-validated
          cloud_path: mozambique/validated
      kenya:
        raw:
          file_prefix: trips-raw
          cloud_path: kenya/raw
        validated:
          file_prefix: trips-validated
          cloud_path: kenya/validated
      zanzibar:
        raw:
          file_prefix: trips-raw
          cloud_path: zanzibar/raw
        validated:
          file_prefix: trips-validated
          cloud_path: zanzibar/validated
  surveys:
    zanzibar:
      wf:
        validated: wf-surveys-validated
        merged: wf-surveys-merged
    kenya:
      merged: kenya-surveys-matched-trips
      kefs:
        validated: kefs-v2-surveys-validated
        merged: kefs-v2-surveys-merged
    mozambique:
      adnap:
        validated: wf-adnap-surveys-validated
        merged: wf-adnap-surveys-merged
      lurio:
        validated: wf-lurio-surveys-validated
  pds:
    customers:
      - "WorldFish - Mozambique"
      - "Syberintel - distributor"
      - "Kenya"
      - "Kenya AABS" 
      - "WorldFish - Kenya"
      - "WorldFish - Tanzania AP"
      - "WorldFish - Zanzibar"
    token: !expr Sys.getenv('PDS_TOKEN')
    secret: !expr Sys.getenv('PDS_SECRET')
    username: !expr Sys.getenv('PDS_USERNAME')
    password: !expr Sys.getenv('PDS_PASSWORD')
    customer_id: !expr Sys.getenv('PDS_CUSTOMER_ID')
    pds_trips:
      file_prefix: pds-trips
      version: latest
    pds_tracks:
      file_prefix: pds-tracks
      version: latest      
    pds_tracks_predicted:
      file_prefix: predicted-pds-tracks
      version: latest      
    pds_tracks_h3_grid:
      file_prefix: predicted-pds-h3_grid
      version: latest
    pds_cpue:
      file_prefix: pds-cpue
      version: latest
    portal:
      effort:
        file_prefix: pds-h3-effort-r
        version: latest
      effort_gear:
        file_prefix: pds-h3-effort-gear-r
        version: latest
      cpue:
        file_prefix: pds-cpue-r
        version: latest
      fishing_grounds:
        file_prefix: pds-fishing-grounds
        version: latest
      fishers_stats:
        file_prefix: fishers-stats
        version: latest
      frame_gears:
        file_prefix: frame-gears
        version: latest
  tracks_app:
    backup_users:
      file_prefix: backup-users
    all_tracks:
      file_prefix: all-tracks
  storage:
    google:
      key: gcs
      options:
        project: peskas
        bucket: peskas-coasts-dev
        service_account_key: !expr Sys.getenv('GCP_SA_KEY')
      buckets:
        kenya: kenya-dev
        mozambique: mozambique-dev
        zanzibar: zanzibar-dev
    mongodb:
      coasts_portal:
        connection_string: !expr Sys.getenv('MONGODB_CONNECTION_STRING_COASTS')
        database_name: portal-dev
        collection:
          pds_grids: pds_grids
          wio_map: wio_map
          regional_metrics: regional_metrics
          wio_gaul1: wio_gaul1
          wio_gaul2: wio_gaul2
          metrics_gaul1: metrics_gaul1
          metrics_gaul2: metrics_gaul2
      tracks_app:
        connection_string: !expr Sys.getenv('MONGODB_CONNECTION_STRING_TRACKS')
        database_name: portal-dev
        collection:
          users: users
          catch_events: catch-events
          stats: fishers-stats
          performances: fishers-performance
  pds_storage:
    google:
      key: gcs
      options:
        project: peskas
        bucket: pds-peskas-coasts
        service_account_key: !expr Sys.getenv('GCP_SA_KEY')
  metadata:
    google_sheets:
      name: metadata-tables
      sheet_id: !expr Sys.getenv("GOOGLE_SHEET_ID")
      tables:
        - devices
    airtable:
      name: assets
    fishbase:
      taxa_enriched:
        file_prefix: taxa-fishbase-enriched
        version: latest
  airtable:
    token: !expr Sys.getenv('AIRTABLE_TOKEN')
    frame:
      base_id: !expr Sys.getenv('AIRTABLE_BASE_ID_FRAME')
      tables:
        countries: Countries
        pds_devices: pds_devices
    tracks_app:
      base_id: !expr Sys.getenv('AIRTABLE_BASE_ID_TRACKS_APP')
      tables:
        users: users

production:
  api:
    trips:
      bucket: peskas-api-prod
  storage:
    google:
      options:
        bucket: peskas-coasts
      buckets:
        kenya: kenya-prod
        mozambique: mozambique-prod
        zanzibar: zanzibar-prod
    mongodb:
      coasts_portal:
        database_name: portal
      tracks_app:
        database_name: portal-prod
  pds_storage:
    google:
      options:
        bucket: pds-peskas-coasts
