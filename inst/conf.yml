default:
  pds:
    token: !expr Sys.getenv('PDS_TOKEN')
    secret: !expr Sys.getenv('PDS_SECRET')
    username: !expr Sys.getenv('PDS_USERNAME')
    password: !expr Sys.getenv('PDS_PASSWORD')
    customer_id: !expr Sys.getenv('PDS_CUSTOMER_ID')
    pds_trips:
      file_prefix: pds-trips
      version: latest
    pds_tracks:
      file_prefix: pds-tracks
      version: latest
  storage:
    google:
      key: gcs
      options:
        project: peskas
        bucket: peskas-coasts
        service_account_key: !expr Sys.getenv('GCP_SA_KEY')
    mongodb:
      coasts_portal:
        connection_string: !expr Sys.getenv('MONGODB_CONNECTION_STRING_COASTS')
        database_name: portal
        collection:
          pds_grids: pds_grids
          wio_map: wio_map
          regional_metrics: regional_metrics
      tracks_app:
        connection_string: !expr Sys.getenv('MONGODB_CONNECTION_STRING_TRACKS')
        database_name: portal-dev
        collection:
          users: users
  pds_storage:
    google:
      key: gcs
      options:
        project: peskas
        bucket: pds-peskas-coasts
        service_account_key: !expr Sys.getenv('GCP_SA_KEY')
  metadata:
    google_sheets:
      name: metadata-tables
      sheet_id: !expr Sys.getenv("GOOGLE_SHEET_ID")
      tables:
        - devices
  airtable:
    token: !expr Sys.getenv('AIRTABLE_TOKEN')
    frame:
      base_id: !expr Sys.getenv('AIRTABLE_BASE_ID_FRAME')
      tables:
        countries: Countries
        pds_devices: pds_devices
    tracks_app:
      base_id: !expr Sys.getenv('AIRTABLE_BASE_ID_TRACKS_APP')
      tables:
        users: users

production:
  storage:
    google:
      options:
        bucket: peskas-coasts
    mongodb:
      coasts_portal:
        database_name: portal
      tracks_app:
        database_name: portal-dev
  pds_storage:
    google:
      options:
        bucket: pds-peskas-coasts

local:
  inherits: development
  pds:
    token: !expr readLines('auth/pds-token')
    secret: !expr readLines('auth/pds-secret')
    username: !expr readLines('auth/pds-username')
    password: !expr readLines('auth/pds-password')
    customer_id: !expr readLines('auth/pds-customer-id')
  storage:
    google:
      options:
        service_account_key: !expr readLines("auth/gcp-sa-peskas_ingestion-key.json")
    mongodb:
      coasts_portal:
        connection_string: !expr readLines("auth/mongodb_connection_string_coasts")
      tracks_app:
        connection_string: !expr readLines("auth/mongodb_connection_string_tracks")
  pds_storage:
    google:
      options:
        service_account_key: !expr readLines("auth/gcp-sa-peskas_ingestion-key.json")
  metadata:
    google_sheets:
      sheet_id: !expr readLines("auth/metadata-sheet-id")
  airtable:
    token: !expr readLines("auth/airtable-token")
    frame:
      base_id: !expr readLines("auth/airtable-base-id-frame")
      tables:
        countries: Countries
        pds_devices: pds_devices
    tracks_app:
      base_id: !expr readLines("auth/airtable-base-id-tracks-app")
      tables:
        users: users