url: https://worldfishcenter.github.io/peskas.coasts/

template:
  bootstrap: 5
  bootswatch: flatly
  bslib:
    primary: "#005b96" # Ocean blue
    secondary: "#0392cf" # Lighter coastal blue
    success: "#7bc043" # Sustainable green
    info: "#f37736" # Warm accent
    base_font: {google: "Inter"}
    heading_font: {google: "Montserrat"}

navbar:
  title: "Peskas Coasts"
  structure:
    left: [intro, articles, reference, news]
    right: [peskas, github]
  components:
    intro:
      text: "Our Mission"
      href: index.html
    peskas:
      text: "Peskas.org"
      href: https://peskas.org/
      icon: fas fa-globe

articles:
  - title: "Guides and Tutorials"
    desc: "In-depth explanations of the Peskas Coasts workflows and models."
    contents:
      - pipeline
      - metrics-and-models

reference:
  - title: "The Automated Pipeline"
    desc: "Functions that drive the bi-daily GitHub Actions workflow."
    contents:
      - ingest_assets
      - enrich_taxa
      - ingest_pds_trips
      - merge_survey_trips
      - ingest_pds_tracks
      - preprocess_pds_tracks
      - predict_pds_tracks
      - aggregate_pds_effort
      - model_cpue
  - title: "Data Export & Web Readiness"
    desc: "Preparing the analyzed data for the Peskas portal and web maps."
    contents:
      - export_geos
      - export_fishers_stats
      - export_portal
      - export_pds_spatial
  - title: "Spatial Utilities"
    desc: "Under-the-hood tools for gridding, mapping, and metric conversion."
    contents:
      - assign_h3_indices
      - aggregate_h3_effort
      - rollup_h3_resolution
      - create_spatial_grid
      - derive_fishing_grounds
  - title: "Survey & Fleet Analysis"
    desc: "Functions for survey summarization and fleet activity estimation."
    contents:
      - calculate_catch_record_usage
      - calculate_district_totals
      - calculate_fishery_metrics
      - calculate_monthly_trip_stats
      - estimate_fleet_activity
      - summarize_data
      - generate_fleet_analysis
      - prepare_boat_registry
      - process_trip_data
      - create_usage_heatmap
      - create_usage_table
  - title: "API & Data Ingestion (PDS & Airtable)"
    desc: "Functions interacting with Pelagic Data Systems, Airtable, and KoboToolbox."
    contents:
      - airtable_to_df
      - bulk_update_airtable
      - device_sync
      - df_to_airtable
      - update_airtable_record
      - get_writable_fields
      - pelagic_auth
      - pelagic_refresh_token
      - get_pelagic_boats
      - get_pelagic_devices
      - ingest_pelagic_boats
      - sync_device_users
      - get_trips
      - get_trip_points
  - title: "Other Utilities and Internals"
    desc: "Additional exported helper functions."
    contents:
      - matches(".*")
