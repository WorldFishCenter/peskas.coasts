name: Sync PDS Devices & Users

on:
  schedule:
    # Run every 10 days at 3:00 AM UTC
    - cron: '0 3 */10 * *'
  workflow_dispatch: # Allow manual triggering

env:
  # Airtable credentials
  PDS_TOKEN: ${{ secrets.PDS_TOKEN }}
  PDS_SECRET: ${{ secrets.PDS_SECRET }}
  PDS_USERNAME: ${{ secrets.PDS_USERNAME }}
  PDS_PASSWORD: ${{ secrets.PDS_PASSWORD }}
  PDS_CUSTOMER_ID: ${{ secrets.PDS_CUSTOMER_ID }}  
  AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
  AIRTABLE_BASE_ID_FRAME: ${{ secrets.AIRTABLE_BASE_ID_FRAME }}
  AIRTABLE_BASE_ID_TRACKS_APP: ${{ secrets.AIRTABLE_BASE_ID_TRACKS_APP }}
  # MongoDB credentials for tracks app
  MONGODB_CONNECTION_STRING_TRACKS: ${{ secrets.MONGODB_CONNECTION_STRING_TRACKS }}
  # Google Cloud credentials (if needed for logging/storage)
  GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}

jobs:
  build-container:
    name: Build R container
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.prod
          push: true
          tags: ghcr.io/worldfishcenter/peskas.coasts/r-runner-peskas-coasts:latest
          cache-from: type=registry,ref=ghcr.io/worldfishcenter/peskas.coasts/r-runner-peskas-coasts:buildcache
          cache-to: type=registry,ref=ghcr.io/worldfishcenter/peskas.coasts/r-runner-peskas-coasts:buildcache,mode=max

  ingest-pelagic-boats:
    name: Ingest Pelagic Boats Data to Airtable
    needs: build-container
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/worldfishcenter/peskas.coasts/r-runner-peskas-coasts:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Set env to production
        if: endsWith(github.ref, '/main')
        run: echo "R_CONFIG_ACTIVE=production" >> $GITHUB_ENV
      - name: Call ingest_pelagic_boats()
        run: Rscript -e 'coasts::ingest_pelagic_boats()'
      - name: Log completion
        run: echo "✅ Successfully completed Pelagic boats data ingestion"

  sync-device-users:
    name: Sync Devices & Users to MongoDB and Airtable
    needs: ingest-pelagic-boats
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/worldfishcenter/peskas.coasts/r-runner-peskas-coasts:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Set env to production
        if: endsWith(github.ref, '/main')
        run: echo "R_CONFIG_ACTIVE=production" >> $GITHUB_ENV
      - name: Call sync_device_users()
        run: >
          Rscript -e 'result <- coasts::sync_device_users();
          cat("Generated", result$new_passwords_generated, "new passwords\n");
          cat("Synced", result$total_users, "users to MongoDB\n")'
      - name: Log completion
        run: echo "✅ Successfully completed device users synchronization"