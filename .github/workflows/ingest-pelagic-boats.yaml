name: Ingest Pelagic Boats

on:
  schedule:
    # Run every 15 days at 2:00 AM UTC
    - cron: '0 2 */15 * *'
  workflow_dispatch: # Allow manual triggering

env:
  # PDS API credentials
  PDS_TOKEN: ${{ secrets.PDS_TOKEN }}
  PDS_SECRET: ${{ secrets.PDS_SECRET }}
  PDS_USERNAME: ${{ secrets.PDS_USERNAME }}
  PDS_PASSWORD: ${{ secrets.PDS_PASSWORD }}
  PDS_CUSTOMER_ID: ${{ secrets.PDS_CUSTOMER_ID }}
  
  # Airtable credentials
  AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
  AIRTABLE_BASE_ID_FRAME: ${{ secrets.AIRTABLE_BASE_ID_FRAME }}
  
  # Google Cloud credentials
  GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}

jobs:
  build-container:
    name: Build R container
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Build image with cache
        id: build-docker
        uses: whoan/docker-build-with-cache-action@v5
        with:
          username: ${{ github.actor }}
          password: "${{ secrets.GITHUB_TOKEN }}"
          registry: docker.pkg.github.com
          image_name: r-runner-peskas-coasts
          dockerfile: Dockerfile.prod

  ingest-pelagic-boats:
    name: Ingest Pelagic Boats Data
    needs: build-container
    runs-on: ubuntu-latest
    container:
      image: docker.pkg.github.com/worldfishcenter/peskas.coasts/r-runner-peskas-coasts
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Set env to production
        if: endsWith(github.ref, '/main')
        run: echo "R_CONFIG_ACTIVE=production" >> $GITHUB_ENV
      
      - name: Call ingest_pelagic_boats()
        run: Rscript -e 'coasts::ingest_pelagic_boats()'
        
      - name: Log completion
        run: echo "✅ Successfully completed Pelagic boats data ingestion"