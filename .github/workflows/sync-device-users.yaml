name: Sync Device Users

on:
  schedule:
    # Run every 10 days at 3:00 AM UTC
    - cron: '0 3 */10 * *'
  workflow_dispatch: # Allow manual triggering

env:
  # Airtable credentials
  AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
  AIRTABLE_BASE_ID_FRAME: ${{ secrets.AIRTABLE_BASE_ID_FRAME }}
  AIRTABLE_BASE_ID_TRACKS_APP: ${{ secrets.AIRTABLE_BASE_ID_TRACKS_APP }}
  
  # MongoDB credentials for tracks app
  MONGODB_CONNECTION_STRING_TRACKS: ${{ secrets.MONGODB_CONNECTION_STRING_TRACKS }}
  
  # Google Cloud credentials (if needed for logging/storage)
  GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}

jobs:
  build-container:
    name: Build R container
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Build image with cache
        id: build-docker
        uses: whoan/docker-build-with-cache-action@v5
        with:
          username: ${{ github.actor }}
          password: "${{ secrets.GITHUB_TOKEN }}"
          registry: docker.pkg.github.com
          image_name: r-runner-peskas-coasts
          dockerfile: Dockerfile.prod

  sync-device-users:
    name: Sync Device Users to MongoDB
    needs: build-container
    runs-on: ubuntu-latest
    container:
      image: docker.pkg.github.com/worldfishcenter/peskas.coasts/r-runner-peskas-coasts
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Set env to production
        if: endsWith(github.ref, '/main')
        run: echo "R_CONFIG_ACTIVE=production" >> $GITHUB_ENV
      
      - name: Call sync_device_users()
        run: Rscript -e 'result <- coasts::sync_device_users(); cat("Generated", result$new_passwords_generated, "new passwords\n"); cat("Synced", result$total_users, "users to MongoDB\n")'
        
      - name: Log completion
        run: echo "✅ Successfully completed device users synchronization"