name: Peskas Coasts

on:
  push:
  schedule:
    - cron: '0 0 */2 * *'
  workflow_dispatch:  

env:
  # PDS API Credentials
  PDS_TOKEN: ${{ secrets.PDS_TOKEN }}
  PDS_SECRET: ${{ secrets.PDS_SECRET }}
  PDS_USERNAME: ${{ secrets.PDS_USERNAME }}
  PDS_PASSWORD: ${{ secrets.PDS_PASSWORD }}
  PDS_CUSTOMER_ID: ${{ secrets.PDS_CUSTOMER_ID }}
  # Google Cloud Platform
  GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
  # MongoDB Connections
  MONGODB_CONNECTION_STRING_COASTS: ${{ secrets.MONGODB_CONNECTION_STRING_COASTS }}
  MONGODB_CONNECTION_STRING_TRACKS: ${{ secrets.MONGODB_CONNECTION_STRING_TRACKS }}
  # Metadata Services
  GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
  AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
  AIRTABLE_BASE_ID_FRAME: ${{ secrets.AIRTABLE_BASE_ID_FRAME }}
  AIRTABLE_BASE_ID_TRACKS_APP: ${{ secrets.AIRTABLE_BASE_ID_TRACKS_APP }}

jobs:
  build-container:
    name: Build R container
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.prod
          push: true
          tags: ghcr.io/worldfishcenter/peskas.coasts/r-runner-peskas-coasts:latest
          cache-from: type=registry,ref=ghcr.io/worldfishcenter/peskas.coasts/r-runner-peskas-coasts:buildcache
          cache-to: type=registry,ref=ghcr.io/worldfishcenter/peskas.coasts/r-runner-peskas-coasts:buildcache,mode=max

  ingest-static-assets:
    name: Ingest static assets
    needs: build-container
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/worldfishcenter/peskas.coasts/r-runner-peskas-coasts:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Set env to production
        if: endsWith(github.ref, '/main')
        run: echo "R_CONFIG_ACTIVE=production" >> $GITHUB_ENV
      - name: Call ingest_assets()
        run: Rscript -e 'coasts::ingest_assets()'

  enrich-taxa:
    name: Enrich taxa with FishBase data
    needs: ingest-static-assets
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/worldfishcenter/peskas.coasts/r-runner-peskas-coasts:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Set env to production
        if: endsWith(github.ref, '/main')
        run: echo "R_CONFIG_ACTIVE=production" >> $GITHUB_ENV
      - name: Call enrich_taxa()
        run: Rscript -e 'coasts::enrich_taxa()'

  ingest-pds-trips:
    name: Ingest GPS trips
    needs: build-container
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/worldfishcenter/peskas.coasts/r-runner-peskas-coasts:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Set env to production
        if: endsWith(github.ref, '/main')
        run: echo "R_CONFIG_ACTIVE=production" >> $GITHUB_ENV
      - name: Call ingest_pds_trips()
        run: Rscript -e 'coasts::ingest_pds_trips()'

  match-trips:
    name: Match GPS and survey data
    needs: build-container
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/worldfishcenter/peskas.coasts/r-runner-peskas-coasts:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Set env to production
        if: endsWith(github.ref, '/main')
        run: echo "R_CONFIG_ACTIVE=production" >> $GITHUB_ENV
      - name: Call merge_survey_trips()
        run: Rscript -e 'coasts::merge_survey_trips()'      

  ingest-pds-tracks:
    name: Ingest GPS tracks
    needs: ingest-pds-trips
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/worldfishcenter/peskas.coasts/r-runner-peskas-coasts:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Set env to production
        if: endsWith(github.ref, '/main')
        run: echo "R_CONFIG_ACTIVE=production" >> $GITHUB_ENV
      - name: Call ingest_pds_tracks
        run: Rscript -e 'coasts::ingest_pds_tracks()'

  preprocess-pds-tracks:
    name: Preprocess GPS tracks data
    needs: ingest-pds-tracks
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/worldfishcenter/peskas.coasts/r-runner-peskas-coasts:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Set env to production
        if: endsWith(github.ref, '/main')
        run: echo "R_CONFIG_ACTIVE=production" >> $GITHUB_ENV
      - name: Call preprocess_pds_tracks()
        run: Rscript -e 'coasts::preprocess_pds_tracks()'              

  export-data:
    name: Export WIO data
    needs: preprocess-pds-tracks
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/worldfishcenter/peskas.coasts/r-runner-peskas-coasts:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Set env to production
        if: endsWith(github.ref, '/main')
        run: echo "R_CONFIG_ACTIVE=production" >> $GITHUB_ENV
      - name: Call export_geos()
        run: Rscript -e 'coasts::export_geos()'        

  export-fishers-stats:
    name: Export fishers stats
    needs: preprocess-pds-tracks
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/worldfishcenter/peskas.coasts/r-runner-peskas-coasts:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Set env to production
        if: endsWith(github.ref, '/main')
        run: echo "R_CONFIG_ACTIVE=production" >> $GITHUB_ENV
      - name: Call export_fishers_stats()
        run: Rscript -e 'coasts::export_fishers_stats()'

  predict-pds-tracks:
    name: Predict fishing tracks and aggregate to H3 grid
    needs: preprocess-pds-tracks
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/worldfishcenter/peskas.coasts/r-runner-peskas-coasts:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Set env to production
        if: endsWith(github.ref, '/main')
        run: echo "R_CONFIG_ACTIVE=production" >> $GITHUB_ENV
      - name: Call predict_pds_tracks()
        run: Rscript -e 'coasts::predict_pds_tracks()'
      - name: Call aggregate_pds_effort()
        run: Rscript -e 'coasts::aggregate_pds_effort()'

  model-cpue:
    name: Run spatial CPUE model
    needs: [predict-pds-tracks, match-trips]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/worldfishcenter/peskas.coasts/r-runner-peskas-coasts:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Set env to production
        if: endsWith(github.ref, '/main')
        run: echo "R_CONFIG_ACTIVE=production" >> $GITHUB_ENV
      - name: Call model_cpue()
        run: Rscript -e 'coasts::model_cpue()'

  export-pds-spatial:
    name: Export spatial outputs as JSON/GeoJSON for web
    needs: [predict-pds-tracks, model-cpue]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/worldfishcenter/peskas.coasts/r-runner-peskas-coasts:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Set env to production
        if: endsWith(github.ref, '/main')
        run: echo "R_CONFIG_ACTIVE=production" >> $GITHUB_ENV
      - name: Call export_pds_spatial()
        run: Rscript -e 'coasts::export_pds_spatial()'

